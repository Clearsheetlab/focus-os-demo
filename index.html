function navHTML(){const s=db.settings;return NAV.map(([g,items])=>{const v=items.filter(([id,t,i,c,e,m])=>(!m||s.money)&&(!s.simple||e||page===id));return v.length?`<div class="nav-h">${g}</div>`+v.map(([id,t,i,c])=>`<a href="#/${id}" class="${page===id?'on':''}">${tile(i,c)}<span>${t}</span>${navCount(id)}</a>`).join(''):''}).join('')}
function tabHTML(){const m=db.settings.money,T=(id,t,i)=>`<a href="#/${id}" class="${page===id?'on':''}">${ic(i)}<span>${t}</span></a>`;return T('today','Today','sun')+T('plan','Plan','calendar')+`<button class="plus" data-act="quick" aria-label="Quick add">${ic('plus')}</button>`+(m?T('bills','Money','wallet'):T('tasks','Tasks','tasks'))+`<a href="#" data-act="menu" class="${''}">${ic('menu')}<span>More</span></a>`}
let navigating=false;
function render(nav){
 if(localISO(new Date())!==TODAY){TODAY=localISO(new Date());settleAutopay()}
 const s=db.settings,h=document.documentElement;
 if(s.theme==='auto')h.removeAttribute('data-theme');else h.dataset.theme=s.theme;h.dataset.accent=s.accent;h.dataset.font=s.font;h.dataset.calm=String(!!s.calm);h.dataset.simple=String(!!s.simple);
 const y=window.scrollY;let html;
 try{html=(MONEYP.includes(page)&&!s.money)?head('Money tools are off','Turn them on to use safe-to-spend, bills, envelopes, goals and more.')+`<div class="card">${empty('wallet','Money tools are switched off','Your focus and life tools are unaffected. You can switch them on any time.',`<button class="btn primary" data-act="moneyOn">Turn on money tools</button>`)}</div>`:PG[page]()}catch(e){console.error(e);html=head('Something went sideways','This page hit an error.')+`<div class="card"><p class="sub">${esc(e.message)}</p><div class="hero-acts"><button class="btn primary" data-act="go" data-id="today">Back to Today</button></div></div>`}
 $('#content').innerHTML=html;$('#sidebar').querySelector('nav').innerHTML=navHTML();$('#tabbar').innerHTML=tabHTML();$('#ttl').textContent=(ALLP.find(p=>p.id===page)||{}).t||'';
 $('#banner').innerHTML=(storageOK?'':`<div class="banner">${ic('shield')}<span><b>Your browser is blocking storage.</b> Changes will not survive closing this tab. <a href="#/settings" style="color:var(--accent)">Download a backup</a> before you leave.</span></div>`)+demoBanner()+lookBanner()+updBanner();
 {const sb=$('#simpleBtn');sb.classList.toggle('on',!!s.simple);sb.setAttribute('aria-pressed',String(!!s.simple))}
 $('#themeBtn').innerHTML=ic(h.dataset.theme==='dark'||(!h.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches)?'sun':'moon');
 ftUI();if(page==='goals')whatIf();
 if(nav){window.scrollTo(0,0);const c=$('#content');c.style.animation='none';void c.offsetHeight;c.style.animation=''}else window.scrollTo(0,y);
 $('#sidebar').classList.remove('open')}
function route(){const p=location.hash.replace(/^#\/?/,'')||'today';page=PG[p]?p:'today';ui.q='';const q=$('#search');if(q)q.value='';render(true)}

/* ---------- Actions ---------- */
A.seg=(el,id,d)=>{ui.seg[d.k]=d.v;if(d.k==='debtStrategy'){db.debtPlan.strategy=d.v;save()}render()};
A.add=(el,id,d)=>openForm(id,'',d.pre?JSON.parse(d.pre):{});
A.edit=(el,id,d)=>openForm(d.type,id);
A.del=(el,id,d)=>{snap();db[d.type]=db[d.type].filter(x=>x.id!==id);closeSheet();save();render();toast('Deleted',true)};
A.go=(el,id)=>{closeSheet();go(id)};
A.csv=(el,id)=>csvExport(id);
A.undo=()=>doUndo();
A.closeSheet=()=>closeSheet();
A.submitForm=()=>submitForm();
A.menu=()=>$('#sidebar').classList.toggle('open');
A.moneyOn=()=>{db.settings.money=true;if(!db.categories.length)db.categories=defaultCats();save();render();A.checkMoney()};
A.backup=()=>{db.settings.lastBackup=TODAY;flush();download(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),`ClearSheetLab-ADHD-Focus-Life-OS-Pro-${TODAY}.json`);render();toast('Backup downloaded')};
A.restore=()=>$('#restoreInput').click();
let askFn=null;
function ask(title,text,ok,fn,red){askFn=fn;sheet(title,`<p class="sub" style="font-size:15px">${text}</p>`,`<button class="btn" data-act="closeSheet">Cancel</button><button class="btn ${red?'red':'primary'}" data-act="askOk">${ok}</button>`)}
A.askOk=()=>{const f=askFn;askFn=null;closeSheet();f&&f()};
A.sample=()=>ask('Load sample data?','This replaces everything in the app with a filled-in example so you can explore. Download a backup first if you have real data.','Load sample',()=>{const k=db.settings;db=seedData(k.name);Object.assign(db.settings,{currency:k.currency,accent:k.accent,font:k.font,theme:k.theme,money:true});settleAutopay();checkMilestones(true);save();render();toast('Sample data loaded')},1);
A.blank=()=>ask('Start with a blank workspace?','This clears every task, note, expense and setting entry. Your look and currency stay. Download a backup first if you need the current data.','Start blank',()=>{const k=db.settings;db=blankData({name:k.name,currency:k.currency,accent:k.accent,font:k.font,theme:k.theme,money:k.money});save();render();toast('Blank workspace ready')},1);

/* ---------- Quick add ---------- */
function quickBody(t){if(t==='spend'){ui.exCat=ui.exCat||db.categories[0]?.id;return `${moneyInput('exAmt','',' 0.00')}<div class="chips" id="exCats">${db.categories.map(c=>`<button class="chip ${c.id===ui.exCat?'on':''}" data-act="exCat" data-id="${c.id}">${c.icon} ${esc(c.name)}</button>`).join('')}</div><div class="field mt"><label>Note (optional)</label><input id="exNote" type="text" data-enter="1"></div>`}
 if(t==='task')return `<div class="field"><label>What needs doing?</label><input id="qT" type="text" placeholder="Send the invoice" data-enter="1"></div><div class="field mt"><label>First tiny step (optional)</label><input id="qS" type="text" data-enter="1" placeholder="Open the template"></div><div class="chips mt">${[['','No bucket'],['Must','Must'],['Should','Should'],['Could','Could']].map(([v,l],i)=>`<button class="chip sm ${i===1?'on':''}" data-act="qBucket" data-id="${v}">${l}</button>`).join('')}</div>`;
 if(t==='thought')return `<div class="field"><label>Empty your head</label><textarea id="qT" placeholder="Anything. No sorting yet."></textarea></div>`;
 return `<div class="field"><label>What went well? Even something tiny.</label><textarea id="qT"></textarea></div>`}
function openQuick(t){ui.qTab=t;const tabs=[...(db.settings.money?[['spend','Spend']]:[]),['task','Task'],['thought','Thought'],['win','Win']];sheet('Quick add',`<div style="display:flex;justify-content:center;margin-bottom:14px"><div class="seg">${tabs.map(([a,b])=>`<button class="${a===t?'on':''}" data-act="qTab" data-id="${a}">${b}</button>`).join('')}</div></div><div id="qBody">${quickBody(t)}</div>`,`<button class="btn" data-act="closeSheet">Cancel</button><button class="btn primary" data-act="qSave">Add</button>`)}
A.quick=()=>openQuick(ui.qTab&&(ui.qTab!=='spend'||db.settings.money)?ui.qTab:(db.settings.money?'spend':'task'));
A.qTab=(el,id)=>{ui.qTab=id;$('#qBody').innerHTML=quickBody(id);$$('#sheetB .seg button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));setTimeout(()=>$('#qBody input,#qBody textarea')?.focus(),30)};
A.qBucket=(el,id)=>{ui.qBucket=id;$$('#qBody .chip').forEach(c=>c.classList.toggle('on',c===el))};
A.qSave=()=>{const t=ui.qTab;if(t==='spend')return A.saveExpense();const v=($('#qT')?.value||'').trim();if(!v)return toast('Type something first');snap();
 if(t==='task'){db.tasks.push({id:uid(),title:v,projectId:'',area:'Personal',due:TODAY,status:'To Do',priority:'Medium',todayBucket:ui.qBucket??'Must',energy:'Medium',duration:15,nextStep:($('#qS').value||'').trim(),friction:'',notes:''});touch('task-made')}
 else if(t==='thought'){db.inbox.unshift({id:uid(),text:v,created:TODAY,type:'Unsorted'});touch('inbox')}else{db.wins.unshift({id:uid(),date:TODAY,title:v,reward:''});touch('win');confetti(18)}
 ui.qBucket=undefined;save();closeSheet();render();toast('Added',true)};

/* ---------- Onboarding ---------- */
function onboard(step=1){if(step===1)sheet('Welcome',`<div class="center" style="padding:6px 0 14px"><div style="font:700 28px var(--display);letter-spacing:-.03em">A calmer command center</div><p class="sub" style="margin-top:6px">Focus, tasks, routines and — if you like — an honest daily money number. Private, offline, yours.</p></div><div class="stack"><div class="field"><label>What should I call you?</label><input id="obName" type="text" placeholder="Optional" value="${esc(db.settings.name)}"></div><div class="field"><label>Currency</label><select id="obCur">${['USD','EUR','GBP','RON','CAD','AUD','PLN','CHF','SEK','NOK','DKK','CZK','HUF','JPY','INR','BRL','MXN','NZD'].map(c=>`<option ${db.settings.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><label class="row-flex" style="cursor:pointer"><span class="switch"><input type="checkbox" id="obMoney" ${db.settings.money?'checked':''}><i></i></span><span><b>Include money tools</b><br><span class="sub">Safe to spend, bills, envelopes, goals. You can switch this off any time.</span></span></label></div>`,`<button class="btn primary block" data-act="obNext">Continue</button>`);
 else sheet('How would you like to start?',`<div class="stack"><button class="row card tight" style="border-radius:18px" data-act="obSample"><span class="tile lg" style="--c:#ff9500">${ic('sparkles')}</span><span class="body"><span class="t" style="display:block;font-weight:650">Explore with an example</span><span class="s" style="display:block">A filled-in workspace so you can see how everything fits. Clear it any time.</span></span></button><button class="row card tight" style="border-radius:18px" data-act="obBlank"><span class="tile lg" style="--c:#34c759">${ic('plus')}</span><span class="body"><span class="t" style="display:block;font-weight:650">Start blank</span><span class="s" style="display:block">A clean slate${db.settings.money?' — I will help you set your first number':''}.</span></span></button></div>`,'')}
A.obNext=()=>{db.settings.name=$('#obName').value.trim();db.settings.currency=$('#obCur').value;db.settings.money=$('#obMoney').checked;onboard(2)};
A.obSample=()=>{const k=db.settings;db=seedData(k.name);db.settings.currency=k.currency;db.settings.money=k.money;db.settings.onboarded=true;settleAutopay();checkMilestones(true);save();closeSheet();render();toast('Have a look around')};
A.obBlank=()=>{const k=db.settings;db=blankData({name:k.name,currency:k.currency,money:k.money});save();closeSheet();render();if(db.settings.money)setTimeout(()=>A.checkMoney(),450)};

/* ---------- Command palette ---------- */
let cmdSel=0,cmdList=[];
function cmdItems(q){q=q.toLowerCase().trim();const m=db.settings.money,acts=[['Back to normal look (full view, normal colours)','eye','#5856d6',()=>A.normalLook()],['Add expense','plus','#34c759',()=>A.addExpense(),m],['Add task','plus','#007aff',()=>openForm('tasks')],['Capture a thought','inbox','#ff9f0a',()=>{ui.qTab='thought';openQuick('thought')}],['Check my money','wallet','#34c759',()=>A.checkMoney(),m],['Can this fit?','wallet','#ff9500',()=>A.canFit(),m],['Start a 25-minute focus','timer','#5856d6',()=>{ftSet(25);ftStart();go('now')}],['Too much? Make it smaller','lifebuoy','#30b0c7',()=>A.overwhelm()],['Toggle dark mode','moon','#8e8e93',()=>A.toggleDark()],['Toggle simple view','eye','#8e8e93',()=>{db.settings.simple=!db.settings.simple;save();render()}],['Download backup','download','#007aff',()=>A.backup()]].filter(a=>a[4]!==false);
 const out=[];const push=(g,arr)=>{if(arr.length)out.push({h:g});arr.forEach(x=>out.push(x))};
 push('Go to',ALLP.filter(p=>(!p.m||m)&&(!q||p.t.toLowerCase().includes(q))).slice(0,q?8:7).map(p=>({t:p.t,i:p.i,c:p.c,s:p.g,f:()=>go(p.id)})));
 push('Actions',acts.filter(a=>!q||a[0].toLowerCase().includes(q)).slice(0,5).map(a=>({t:a[0],i:a[1],c:a[2],s:'Action',f:a[3]})));
 if(q.length>=2){const D=[];db.tasks.filter(x=>x.title.toLowerCase().includes(q)).slice(0,3).forEach(x=>D.push({t:x.title,i:'tasks',c:'#34c759',s:'Task',f:()=>openForm('tasks',x.id)}));db.notes.filter(x=>(x.title+x.body).toLowerCase().includes(q)).slice(0,3).forEach(x=>D.push({t:x.title,i:'note',c:'#ffcc00',s:'Note',f:()=>openForm('notes',x.id)}));if(m){db.bills.filter(x=>x.name.toLowerCase().includes(q)).slice(0,3).forEach(x=>D.push({t:x.name,i:'receipt',c:'#ff3b30',s:'Bill',f:()=>openForm('bills',x.id)}));db.goals.filter(x=>x.name.toLowerCase().includes(q)).slice(0,2).forEach(x=>D.push({t:x.name,i:'flag',c:'#af52de',s:'Goal',f:()=>openForm('goals',x.id)}))}db.projects.filter(x=>x.name.toLowerCase().includes(q)).slice(0,2).forEach(x=>D.push({t:x.name,i:'folder',c:'#5856d6',s:'Project',f:()=>openForm('projects',x.id)}));push('Found in your workspace',D)}
 return out}
function cmdRender(){const q=$('#cmdkIn').value;const items=cmdItems(q);cmdList=items.filter(x=>!x.h);cmdSel=Math.min(cmdSel,Math.max(0,cmdList.length-1));let n=-1;$('#cmdkRes').innerHTML=items.map(x=>x.h?`<div class="gh">${x.h}</div>`:(n++,`<button class="it ${n===cmdSel?'on':''}" data-act="cmdPick" data-id="${n}">${tile(x.i,x.c,'sm')}<span>${esc(x.t)}</span><small>${esc(x.s)}</small></button>`)).join('')||'<div class="empty" style="padding:24px">No matches</div>'}
function openCmd(){$('#cmdk').classList.add('open');$('#scrim').classList.add('open');$('#scrim').dataset.act='closeCmd';const i=$('#cmdkIn');i.value='';cmdSel=0;cmdRender();setTimeout(()=>i.focus(),30)}
function closeCmd(){$('#cmdk').classList.remove('open');if(!$('#sheet').classList.contains('open'))$('#scrim').classList.remove('open');$('#scrim').dataset.act='closeSheet'}
A.closeCmd=closeCmd;A.openCmd=openCmd;A.cmdPick=(el,id)=>{const it=cmdList[num(id)];closeCmd();it&&setTimeout(it.f,60)};
function demoBanner(){return window.__DEMO?`<div class="banner">${ic('star')}<span><b>Live demo</b> — try everything, nothing is saved. <a href="#" data-act="buyFull" style="color:var(--accent);font-weight:600">Get the full version</a> to keep your own data and settings.</span></div>`:''}
function lookBanner(){const s=db.settings;if(!s.simple&&!s.calm)return'';const w=[s.simple&&'Simple view',s.calm&&'Low-stimulation mode'].filter(Boolean).join(' + ');return`<div class="banner lookbar">${ic('eye')}<span><b>${w} is on.</b> Some things are hidden or muted.</span><button class="btn primary sm" data-act="normalLook">Back to normal</button></div>`}
A.normalLook=()=>{const s=db.settings;s.simple=false;s.calm=false;s.calmAuto=false;save();render();toast('Back to the normal look')};
A.toggleSimple=()=>{const s=db.settings;s.simple=!s.simple;let m=s.simple?'Simple view on — only the essentials':'Full view on';if(!s.simple&&s.calmAuto){s.calm=false;s.calmAuto=false;m='Full view and normal colours back on'}save();render();toast(m)};
A.toggleDark=()=>{const h=document.documentElement,dark=h.dataset.theme==='dark'||(!h.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);db.settings.theme=dark?'light':'dark';save();render()};

/* ---------- Events ---------- */
document.addEventListener('click',e=>{const sb=$('#sidebar');if(sb.classList.contains('open')&&!e.target.closest('#sidebar')&&!e.target.closest('[data-act="menu"]'))sb.classList.remove('open');
 const el=e.target.closest('[data-act]');if(!el)return;if(el.dataset.change)return;const f=A[el.dataset.act];if(!f)return;if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();e.preventDefault();try{f(el,el.dataset.id,el.dataset)}catch(err){console.error(err);toast('Something went wrong')}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.change&&A[t.dataset.act]){A[t.dataset.act](t);return}
 if(t.dataset.set){const k=t.dataset.set;let v=t.type==='checkbox'?t.checked:t.type==='number'?num(t.value):t.value;db.settings[k]=v;if(k==="calm")db.settings.calmAuto=false;if(k==='money'&&v&&!db.categories.length)db.categories=defaultCats();save();render();return}
 if(t.id==='dbtExtra'){db.debtPlan.extra=num(t.value);save();render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='search'){ui.q=t.value.trim().toLowerCase();const p=t.selectionStart;render();const q=$('#search');q.focus();q.setSelectionRange(p,p);return}
 if(t.id==='fitP')fitCalc();else if(t.dataset.live==='whatif')whatIf();else if(t.id==='dbtExtra')$('#dbtExtraV').textContent=mny(t.value,0);else if(t.id==='cmdkIn'){cmdSel=0;cmdRender()}});
document.addEventListener('keydown',e=>{const t=e.target;
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#cmdk').classList.contains('open')?closeCmd():openCmd();return}
 if(e.key==='Escape'){if($('#cmdk').classList.contains('open'))closeCmd();else if($('#sheet').classList.contains('open'))closeSheet();return}
 if($('#cmdk').classList.contains('open')){if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdList.length-1,cmdSel+1);cmdRender()}else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(0,cmdSel-1);cmdRender()}else if(e.key==='Enter'){e.preventDefault();A.cmdPick(null,cmdSel)}return}
 if(e.key==='Enter'&&t.dataset&&t.dataset.enter){e.preventDefault();if(t.dataset.enter==='1')$('#sheetF .btn.primary')?.click();else A[t.dataset.enter]?.(t);return}
 const typing=/INPUT|TEXTAREA|SELECT/.test(t.tagName);if(!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){if(e.key==='/'){e.preventDefault();openCmd()}else if(e.key==='a'||e.key==='n')A.quick()}});
window.addEventListener('scroll',()=>$('#topbar').classList.toggle('scrolled',scrollY>30),{passive:true});
window.addEventListener('hashchange',route);
$('#restoreInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!x.version||!x.settings||!Array.isArray(x.tasks))throw Error('bad');snap();db=migrate(x);db.settings.onboarded=true;db.settings.seenV2=true;save();render();toast('Backup restored')}catch(err){toast('That file is not a valid backup')}};r.readAsText(f);e.target.value=''});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&FT.running)ftTick()});

/* ---------- Demo + Apple Pay quick-add ---------- */
const ETSY_URL=window.__ETSY||'https://www.etsy.com/listing/4549656599';
A.buyFull=()=>window.open(ETSY_URL,'_blank','noopener');
if(window.__DEMO){['backup','restore','syncExport','syncMerge','applePayGuide'].forEach(k=>A[k]=()=>toast('Available in the full version'))}
function quickAddFromURL(){if(window.__DEMO)return;let p;try{p=new URLSearchParams(location.search)}catch(e){return}
 if(!p.has('spend'))return;const m=String(p.get('spend')).replace(/\s/g,'').match(/\d+(?:[.,]\d{1,2})?/);const note=(p.get('note')||'').slice(0,80),cat=(p.get('cat')||'').toLowerCase();
 history.replaceState(null,'',location.pathname+location.hash);if(!m)return;
 const c=db.categories.find(x=>x.name.toLowerCase()===cat);if(c)ui.exCat=c.id;
 setTimeout(()=>{A.addExpense();const a=$('#exAmt'),n=$('#exNote');if(a)a.value=m[0].replace(',','.');if(n)n.value=note;toast('Check and tap Add expense')},500)}
/* ---------- Boot ---------- */
testStorage();
db=load();let first=false;
if(!db){db=seedData('');db.settings.onboarded=!!window.__DEMO;db.settings.seenV2=true;first=!window.__DEMO}
settleAutopay();checkMilestones(true);
FT.total=FT.remaining=num(db.settings.defaultFocus||25)*60;
setInterval(()=>{if(localISO(new Date())!==TODAY)render()},60000);
route();
if(first||!db.settings.onboarded)setTimeout(()=>onboard(1),350);
quickAddFromURL();

</script>
</body>
</html>
